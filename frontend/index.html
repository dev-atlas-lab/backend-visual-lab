<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend Visual Lab — Interactive Backend Engineering Platform</title>
    <meta
      name="description"
      content="Interactive learning and deterministic simulation platform for Backend Engineering: Apache Kafka, PostgreSQL Internals, Redis Caching, Distributed Systems, and System Design."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />

    <!-- Google Fonts: Inter & JetBrains Mono for pristine typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var pref = localStorage.getItem("bvl.theme");
          var valid = pref === "dark" || pref === "light" || pref === "system" ? pref : "dark";
          var resolved =
            valid === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : valid;
          document.documentElement.setAttribute("data-theme-preference", valid);
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme-preference", "dark");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
