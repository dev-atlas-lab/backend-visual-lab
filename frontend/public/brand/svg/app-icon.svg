<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="dalIconTitle">
  <title id="dalIconTitle">Dev Atlas Lab app icon</title>
  <defs>
    <linearGradient id="dalIconTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242B"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="dalIconCopper" x1="0" y1="14" x2="0" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C6A0"/>
      <stop offset="1" stop-color="#D08553"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#dalIconTile)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="14.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.2"/>

  <!-- survey line: the crossbar sits on a measured latitude -->
  <g stroke="#E2A173" stroke-width="1.1" stroke-linecap="round">
    <path d="M9 35.6H55" stroke-opacity="0.30"/>
    <path d="M9 33.4V37.8" stroke-opacity="0.50"/>
    <path d="M55 33.4V37.8" stroke-opacity="0.50"/>
  </g>

  <g transform="translate(1.4 1.4) scale(0.956)">
    <path d="M15 49 32 14 49 49M21.3 36h21.4" fill="none" stroke="url(#dalIconCopper)" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="49" r="3.4" fill="#F2BB90"/>
    <circle cx="49" cy="49" r="3.4" fill="#F2BB90"/>
  </g>
</svg>
