<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="dalMarkTitle">
  <title id="dalMarkTitle">Dev Atlas Lab</title>
  <defs>
    <linearGradient id="dalMarkCopper" x1="0" y1="14" x2="0" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6C6A0"/>
